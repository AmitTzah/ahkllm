			#chat-input {
				flex-grow: 1;

			#chat-input:focus {

			/* Chat message bubbles */
			.chat-message {
				display: flex;
				flex-direction: column;
				position: relative;
				animation: msgFadeIn 0.25s ease-out;
				margin-bottom: 2.5rem;
			}

			@keyframes msgFadeIn {
				from { opacity: 0; transform: translateY(8px); }
				to   { opacity: 1; transform: translateY(0); }
			}

			/* Assistant: plain text, no bubble, constrained by parent column */
			.chat-message.assistant {
				width: 100%;
				padding: 0;
				background: none;
				border: none;
				border-radius: 0;
				box-shadow: none;
				color: var(--bs-body-color);
			}

			/* User: right-aligned bubble within the same column, inset from right edge */
			.chat-message.user {
				align-self: flex-end;
				max-width: 70%;
				padding: 12px 20px;
				border-radius: 1.25rem;
				margin-right: 0.75rem;
				color: var(--bs-body-color);

				border: 1px solid #e0e0e0;

			}

			}

			.chat-message.assistant .message-label {

				font-size: 0.7rem;
			}

			.chat-message .message-content {

			}

			.chat-message .message-content p:last-child {

			}

			.chat-message.user .message-content a {

				text-decoration: underline;
			}

			.chat-message .message-actions {

				margin-top: 0.25rem;

				transition: opacity 0.15s ease;

			.chat-message:hover .message-actions {

			}

				color: var(--bs-body-color);
			}

				border-color: var(--bs-border-color);
				background-color: var(--bs-body-bg);
			}

			.chat-message.user .message-actions button:hover {
				background-color: var(--bs-tertiary-bg);
				color: var(--bs-body-color);
			}

			.loading-indicator {

				display: flex;
				gap: 0.3rem;
				padding: 0.5rem 0;
			}

			.loading-indicator .dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background-color: var(--bs-secondary-color);
				animation: bounce 1.4s infinite ease-in-out both;
			}

			.loading-indicator .dot:nth-child(1) { animation-delay: -0.32s; }
			.loading-indicator .dot:nth-child(2) { animation-delay: -0.16s; }
			.loading-indicator .dot:nth-child(3) { animation-delay: 0s; }

			@keyframes bounce {
				0%, 80%, 100% { transform: scale(0); }
				40% { transform: scale(1); }
			}

			/* Streaming cursor */
			.streaming-cursor {

			}

			.thinking-pulse {

				var navText = document.getElementsByClassName("nav-text");

					if (navText[i].style.display === "none") {
						navText[i].style.display = "inline-block";
						element.innerText = "Collaspe Panel";

					}
				}
