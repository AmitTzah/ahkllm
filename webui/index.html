		<script>
			function collapsePanel(element) {
				var navText = document.getElementsByClassName("nav-text");
				for (i = 0; i < navText.length; i++) {
					if (navText[i].style.display === "none") {
						navText[i].style.display = "inline-block";
						element.innerText = "Collapse Panel";
					}
					else {
						navText[i].style.display = "none";
						element.innerText = "Expand Panel";
					}
				}
			}
		</script>

		<main class="d-flex flex-nowrap mt-2" style="height:calc(100vh - 40px);">
			
			<!-- Sidebar (D6: Thread list sidebar) -->
			<div id="chat-sidebar" style="display:none;flex-direction:column;width:260px;min-width:260px;border-right:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg);height:100%;overflow:hidden;">

				</div>
				<div id="thread-list" style="flex:1;overflow-y:auto;">

				</div>
			</div>

			<!-- Page Content -->

			<!-- Toolbar -->
			<div style="display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0.75rem;border-bottom:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg);flex-shrink:0;">
				<button id="sidebar-toggle" title="Chats" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">☰</button>
				<button id="tree-view-btn" title="Chat Tree" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">🌳</button>
				<button id="usage-dashboard-btn" title="Usage Dashboard" onclick="chrome.webview.postMessage(JSON.stringify({action:'openUsageDashboard'}))" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">📊</button>
				<button id="nav-toggle" title="Message Navigator" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">📋</button>
				<span style="color:var(--bs-secondary-color);font-size:0.75rem;margin-left:0.5rem;">Assistant:</span>
				<select id="assistant-selector" onchange="onAssistantSelect()" style="font-size:0.8rem;padding:2px 4px;border:1px solid var(--bs-border-color);border-radius:4px;background:var(--bs-body-bg);color:var(--bs-body-color);max-width:180px;">
					<option value="">Default Model</option>
				</select>
				<button id="settings-btn" title="Model Settings" onclick="openModelSettings()" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">⚙</button>
			</div>
			<!-- Chat Layout (shown for pasteMode "chat") -->
		<div id="chat-layout">
			<div id="fim-notice" style="display:none;">Fill In the Middle — no chat history</div>
			<div id="token-usage-bar" style="display:none;">
				<div id="token-usage-content"></div>
			</div>
			<div id="chat-messages">
				<!-- Chat bubbles will be rendered here -->
			</div>
				<div id="chat-input-area">
					<div id="attachment-bar" style="display:none;"></div>
					<input type="file" id="attachment-file-input" accept="image/*,.pdf,.docx,.pptx,.xlsx,.odt,.odp,.ods,.rtf,.txt,.md,.py,.js,.ahk,.json,.xml,.csv,.ini,.cfg,.yaml,.yml,.log,.html,.css,.sql,.bat,.ps1,.sh,.java,.c,.cpp,.h,.rs,.go,.ts,.tsx,.jsx,.toml" multiple style="display:none;">
					<button type="button" id="attachment-browse-btn" title="Attach files">📎+</button>
					<textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
					<button type="button" id="chat-send-btn">Send</button>
					<button type="button" id="copy-entire-chat-btn" title="Copy entire chat">📋 Copy All</button>
				</div>
			</div>
			<!-- Fallback content for non-chat modes (e.g. FIM) -->
			<div id="content">

				<h3 style="margin:0 0 1rem 0;font-size:1rem;">Model Settings</h3>

					<select id="settings-provider" onchange="onSettingsProviderChange()" style="width:100%;font-size:0.85rem;padding:4px 8px;border:1px solid var(--bs-border-color);border-radius:4px;background:var(--bs-body-bg);color:var(--bs-body-color);">
						<option value="">Select provider...</option>

				</div>
				<div style="margin-bottom:0.75rem;">

					<select id="settings-model" style="width:100%;font-size:0.85rem;padding:4px 8px;border:1px solid var(--bs-border-color);border-radius:4px;background:var(--bs-body-bg);color:var(--bs-body-color);">
						<option value="">Select model...</option>

				</div>
				<div style="margin-bottom:0.75rem;">

					<textarea id="settings-system-prompt" rows="6" style="width:100%;font-size:0.85rem;padding:4px 8px;border:1px solid var(--bs-border-color);border-radius:4px;background:var(--bs-body-bg);color:var(--bs-body-color);resize:vertical;min-height:100px;"></textarea>
				</div>
				<div style="margin-bottom:0.75rem;display:flex;gap:1rem;">

						<label style="display:block;font-size:0.8rem;color:var(--bs-secondary-color);margin-bottom:0.25rem;">Reasoning</label>
						<select id="settings-reasoning" style="width:100%;font-size:0.85rem;padding:4px 8px;border:1px solid var(--bs-border-color);border-radius:4px;background:var(--bs-body-bg);color:var(--bs-body-color);">

						<input id="settings-temperature" type="number" step="0.1" min="0" max="2" placeholder="default" style="width:100%;font-size:0.85rem;padding:4px 8px;border:1px solid var(--bs-border-color);border-radius:4px;background:var(--bs-body-bg);color:var(--bs-body-color);">
					</div>
				</div>
				<div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1rem;">

					<button onclick="saveModelSettings()" style="padding:6px 16px;border:none;border-radius:4px;background:var(--bs-primary);color:white;cursor:pointer;">Save</button>

		Dependency chain:
		  chat-core.js (state: chatMessages, isChatMode, isLoading, activeThreadId)
		    ↓ chat-settings.js (assistant selector dropdown)

		    ↓ chat-render.js (bubble creation, DOM rendering, incremental updates — depends on chatMessages, copySingleMessage)
		    ↓ chat-actions.js (message action buttons — depends on chat-sidebar functions)
		    ↓ chat-input.js (send, loading, keyboard, retry — depends on chatMessages, removeLastAssistantMessage)
		    ↓ chat-branching.js (edit, delete, branch nav, tree viz)
		    ↓ chat-sidebar.js (thread list sidebar, nav bar)
		    ↓ chat-quote.js (text selection popup — uses autoResizeChatInput)
		    ↓ chat-feedback.js (thumbs up/down)
		    ↓ chat-undo.js (Ctrl+Z/Y — reads chatMessages)
		    ↓ stream.js (streaming — uses addMessageActions, createBranchBadge)
		    ↓ chat-settings-modal.js (model settings modal — depends on stream.js functions)
