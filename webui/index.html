		<script>
			function collapsePanel(element) {
				var navText = document.getElementsByClassName("nav-text");
				for (i = 0; i < navText.length; i++) {
					if (navText[i].style.display === "none") {
						navText[i].style.display = "inline-block";
						element.innerText = "Collaspe Panel";
					}
					else {
						navText[i].style.display = "none";
						element.innerText = "Expand Panel";
					}
				}
			}
		</script>

	<body class="bg-body-tertiary">
		
		<div class="b-example-divider bg-body-tertiary" style="height:1px;"></div>

		<main class="d-flex flex-nowrap mt-2" style="height:calc(100vh - 40px);">
			
			<!-- Sidebar (D6: Thread list sidebar) -->
			<div id="chat-sidebar" style="display:none;flex-direction:column;width:260px;min-width:260px;border-right:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg);height:100%;overflow:hidden;">
				<div style="padding:0.75rem;border-bottom:1px solid var(--bs-border-color);display:flex;justify-content:space-between;align-items:center;">
					<strong style="font-size:0.9rem;">📚 Chats</strong>
					<button id="new-chat-btn" style="background:var(--bs-primary);color:white;border:none;border-radius:0.25rem;padding:2px 10px;font-size:0.75rem;cursor:pointer;">+ New</button>
				</div>
				<div id="thread-list" style="flex:1;overflow-y:auto;">
					<!-- Thread list populated by chat-sidebar.js -->
				</div>
			</div>

			<!-- Page Content -->
		<div class="flex-grow-1 flex-column bg-body-tertiary" id="page-content">
			<!-- Toolbar -->
			<div style="display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0.75rem;border-bottom:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg);flex-shrink:0;">
				<button id="sidebar-toggle" title="Chats" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">☰</button>
				<button id="tree-view-btn" title="Chat Tree" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">🌳</button>
				<button id="nav-toggle" title="Message Navigator" style="background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;">📋</button>
			</div>
			<!-- Chat Layout (shown for pasteMode "chat") -->
		<div id="chat-layout">
			<div id="fim-notice" style="display:none;">Fill In the Middle — no chat history</div>
			<div id="token-usage-bar" style="display:none;">
				<div id="token-usage-content"></div>
			</div>
			<div id="chat-messages">
				<!-- Chat bubbles will be rendered here -->
			</div>
				<div id="chat-input-area">
					<textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
					<button type="button" id="chat-send-btn">Send</button>
					<button type="button" id="copy-entire-chat-btn" title="Copy entire chat">📋 Copy All</button>
				</div>
			</div>
			<!-- Fallback content for non-chat modes (e.g. FIM) -->
			<div id="content">
				<!-- Markdown content will be rendered here for non-chat modes -->
			</div>
		</div>

			<!-- Nav Bar (D6: scrollable message list) -->
			<div id="chat-nav-bar" style="display:none;flex-direction:column;width:200px;min-width:200px;border-left:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg);height:100%;overflow:hidden;">
				<div style="padding:0.5rem;border-bottom:1px solid var(--bs-border-color);">
					<strong style="font-size:0.8rem;">📋 Messages</strong>
				</div>
				<div id="nav-message-list" style="flex:1;overflow-y:auto;">
					<!-- Populated by chat-sidebar.js renderNavList() -->
				</div>
			</div>
			<!-- End Page Content -->
		</main>

		<!-- Additional scripts for markdown rendering -->
        <script src="./js/vendor/markdown-it.min.js"></script>
        <script src="./js/vendor/katex.min.js"></script>
        <script src="./js/vendor/mhchem.min.js"></script>
        <script src="./js/vendor/texmath.min.js"></script>

		<!--
		Feature modules — LOAD ORDER IS CRITICAL.
		chat-core.js must be first (defines chatMessages, initChatMode, addMessageActions).
		main.js must be last (orchestrates all modules via handleWebMessage).
		Dependency chain:
		  chat-core.js (core state, rendering, shared actions)
		    ↓ chat-branching.js (edit, delete, branch nav, tree viz)
		    ↓ chat-sidebar.js (thread list sidebar, nav bar)
		    ↓ chat-quote.js (text selection popup)
		    ↓ chat-feedback.js (thumbs up/down)
		    ↓ chat-undo.js (Ctrl+Z/Y — reads chatMessages)
		    ↓ stream.js (streaming — uses addMessageActions, createBranchBadge)
		    ↓ main.js (message handler, DOM init, orchestrator)
		-->
		<script src="./js/chat-core.js"></script>
		<script src="./js/chat-branching.js"></script>
		<script src="./js/chat-sidebar.js"></script>
		<script src="./js/chat-quote.js"></script>
		<script src="./js/chat-feedback.js"></script>
		<script src="./js/chat-undo.js"></script>
		<script src="./js/stream.js"></script>
		<script src="./js/main.js"></script>
	</body>
</html>
