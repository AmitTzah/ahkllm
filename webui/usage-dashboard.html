<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Dashboard</title>
<style>
  :root {
    --bg-main: #FAFAFA; --bg-panel: #FFFFFF; --bg-hover: #F3F4F6; --bg-active: #EEF2FF;
    --text-primary: #111827; --text-secondary: #4B5563; --text-tertiary: #9CA3AF;
    --accent-primary: #4F46E5; --accent-hover: #4338CA; --accent-light: #E0E7FF;
    --border-light: #F3F4F6; --border-main: #E5E7EB; --border-focus: #C7D2FE;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 9999px;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    --font-ui: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--bg-main); color: var(--text-primary); font-family: var(--font-ui); font-size: 14px; }
  body { display: flex; flex-direction: column; overflow-y: auto; }

  .dash-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; flex-shrink: 0; }
  .dash-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }

  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 20px 14px; flex-shrink: 0; }
  .filter-bar select, .filter-bar button {
    font-family: var(--font-ui); font-size: 13px; padding: 6px 12px; border: 1px solid var(--border-main);
    border-radius: var(--radius-sm); background: var(--bg-panel); color: var(--text-primary); cursor: pointer; outline: none;
  }
  .filter-bar select:hover, .filter-bar button:hover { border-color: var(--border-focus); }
  .filter-bar button { display: inline-flex; align-items: center; gap: 4px; }
  .toggle-group { display: inline-flex; border: 1px solid var(--border-main); border-radius: var(--radius-sm); overflow: hidden; }
  .toggle-group button { border: none; border-radius: 0; padding: 5px 12px; font-size: 12px; color: var(--text-tertiary); }
  .toggle-group button.active { background: var(--accent-primary); color: #fff; }

  .summary-row { display: flex; gap: 12px; padding: 0 20px 14px; flex-shrink: 0; }
  .stat-card { flex: 1; background: var(--bg-panel); border: 1px solid var(--border-main); border-radius: var(--radius-md); padding: 14px 16px; text-align: center; }
  .stat-card .value { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .stat-card .label { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .stat-card .cost-info { cursor: help; font-size: 11px; opacity: 0.5; display: inline-block; margin-left: 2px; }

  .chart-card { background: var(--bg-panel); border: 1px solid var(--border-main); border-radius: var(--radius-md); padding: 14px; margin: 0 20px 14px; }
  .chart-card h6 { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 0 0 8px; }
  .chart-header { display: flex; justify-content: space-between; align-items: center; }
  .chart-container { position: relative; min-height: 240px; }
  .chart-container-sm { position: relative; min-height: 170px; width: 100%; }

  .models-section { margin: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .model-section { display: flex; flex-direction: column; }
  .model-section h6 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 0 0 6px; }
  .model-charts { display: flex; gap: 12px; }
  .model-charts > div { flex: 1; min-width: 0; }

  .empty-state { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="dash-header">
  <span class="dash-title">Usage Dashboard</span>
  <span style="font-size:12px;color:var(--text-tertiary);">Data from API logs</span>
</div>

<div class="filter-bar">
  <select id="timeRange"><option value="all">All Time</option><option value="month" selected>Last 30 Days</option><option value="thisMonth">This Month</option><option value="lastMonth">Last Month</option><option value="day">Last 24 Hours</option></select>
  <select id="providerFilter"><option value="">All Providers</option></select>
  <select id="modelFilter"><option value="">All Models</option></select>
  <select id="typeFilter"><option value="all">Chat + Commands</option><option value="chat">Chat Only</option><option value="command">Commands Only</option></select>
  <button id="refreshBtn">Refresh</button>
  <button id="apiLogsBtn" onclick="chrome.webview.postMessage(JSON.stringify({action:'showApiLogs'}))">API Logs</button>
  <button id="exportBtn">CSV</button>
</div>

<div class="summary-row" id="summaryRow">
  <div class="stat-card"><div class="value" id="totalCost">$0.00</div><div class="label">Total Cost <span class="cost-info" id="costInfoIcon" title="">?</span></div></div>
  <div class="stat-card"><div class="value" id="totalCalls">0</div><div class="label">API Requests</div></div>
  <div class="stat-card"><div class="value" id="totalTokens">0</div><div class="label">Total Tokens</div></div>
  <div class="stat-card"><div class="value" id="speedValue">—</div><div class="label">Speed</div></div>
  <div class="stat-card"><div class="value" id="ttftValue">—</div><div class="label">Latency (ttft)</div></div>
</div>

<div class="chart-card">
  <div class="chart-header">
    <h6>Cost Over Time</h6>
    <div class="toggle-group" id="stackToggle">
      <button data-mode="model" class="active">Model</button>
      <button data-mode="provider">Provider</button>
    </div>
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
</div>

<div class="models-section" id="modelSections"></div>

<script src="js/vendor/chart.umd.min.js"></script>
<script src="js/usage-dashboard.js"></script>
</body>
</html>
