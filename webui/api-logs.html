<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Logs Viewer</title>
<style id="themeStyles">
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 16px; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        transition: background 0.2s, color 0.2s;
    }
    body.dark {
        background: #1a1d23; color: #e0e0e0;
        --bg: #1a1d23; --bg2: #22262e; --bg3: #2d323e; --bg4: #161b22;
        --fg: #e0e0e0; --fg2: #9aa0ab; --fg3: #8b949e; --fg4: #aaa;
        --border: #2d323e; --hover: #252a33; --tab-active: #58a6ff;
        --success-bg: #1a3a2a; --success-fg: #3fb950;
        --error-bg: #3a1a1a; --error-fg: #f85149;
        --model: #79c0ff; --row-expand-bg: #0d1117;
    }
    body.light {
        background: #ffffff; color: #1f2328;
        --bg: #ffffff; --bg2: #f6f8fa; --bg3: #e8ecf0; --bg4: #f6f8fa;
        --fg: #1f2328; --fg2: #656d76; --fg3: #656d76; --fg4: #656d76;
        --border: #d0d7de; --hover: #f3f4f6; --tab-active: #0969da;
        --success-bg: #dafbe1; --success-fg: #1a7f37;
        --error-bg: #ffebe9; --error-fg: #cf222e;
        --model: #0550ae; --row-expand-bg: #f6f8fa;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 600; color: var(--fg); }
    .header-controls { display: flex; gap: 8px; align-items: center; }
    .badge { font-size: 12px; background: var(--bg3); padding: 4px 10px; border-radius: 12px; color: var(--fg4); }
    button {
        background: var(--bg3); border: 1px solid var(--border); color: var(--fg); padding: 6px 14px;
        border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.15s;
    }
    button:hover { background: var(--hover); }
    button.danger:hover { background: #5c1a1a; color: #ff6b6b; }
    .table-container { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; min-height: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
        position: sticky; top: 0; background: var(--bg2); color: var(--fg2);
        text-align: left; padding: 10px 12px; font-weight: 600; border-bottom: 1px solid var(--border); z-index: 1;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--hover); }
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .status-success { background: var(--success-bg); color: var(--success-fg); }
    .status-error   { background: var(--error-bg); color: var(--error-fg); }
    .timestamp { color: var(--fg3); white-space: nowrap; }
    .model-name { color: var(--model); }
    .endpoint-cell { color: var(--fg3); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-row { display: none; }
    .detail-row.expanded { display: table-row; }
    .detail-cell { padding: 0 !important; background: var(--row-expand-bg); }
    .detail-inner { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
    .detail-tabs { display: flex; gap: 0; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
    .detail-tab {
        padding: 6px 16px; cursor: pointer; font-size: 12px; color: var(--fg3);
        border-bottom: 2px solid transparent; background: none; border-radius: 0;
        transition: color 0.15s, border-color 0.15s; border: none;
    }
    .detail-tab:hover { color: var(--fg); background: none; }
    .detail-tab.active { color: var(--tab-active); border-bottom-color: var(--tab-active); }
    .detail-content { display: none; }
    .detail-content.active { display: block; }
    pre {
        background: var(--bg4); padding: 12px; border-radius: 6px; overflow-x: auto;
        font-family: Consolas, 'Courier New', monospace; font-size: 12px; line-height: 1.5;
        max-height: 400px; overflow-y: auto; color: var(--fg); white-space: pre-wrap; word-break: break-all;
    }
    .request-header {
        background: var(--bg2); padding: 8px 12px; border-radius: 6px 6px 0 0;
        font-family: Consolas, 'Courier New', monospace; font-size: 12px;
        color: var(--model); border-bottom: 1px solid var(--border); margin-bottom: 0;
    }
    .request-header + pre { border-radius: 0 0 6px 6px; border-top: none; margin-top: 0; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--fg3); gap: 12px; }
    .empty-state .icon { font-size: 48px; opacity: 0.5; }
    .empty-state p { font-size: 14px; }
    .copy-btn { font-size: 11px; padding: 2px 10px; margin-left: 8px; }
</style>
</head>
<body>
<div class="header">
    <h1>API Logs</h1>
    <div class="header-controls">
        <span class="badge" id="entryCount">0 entries</span>
        <button onclick="reloadLogs()">Refresh</button>
        <button class="danger" onclick="clearLogs()">Clear</button>
    </div>
</div>
<div class="table-container" id="tableContainer">
    <div class="empty-state" id="emptyState">
        <div class="icon">&#128269;</div>
        <p>No API interactions logged yet.</p>
        <p style="font-size: 12px;">Send a request to an LLM model and the payload and response will appear here.</p>
    </div>
    <table id="logTable" style="display:none;">
        <thead>
            <tr>
                <th style="width:160px">Timestamp</th>
                <th style="width:140px">Command</th>
                <th style="width:180px">Model</th>
                <th style="width:80px">Latency</th>
                <th style="width:40px">Status</th>
                <th>Endpoint</th>
            </tr>
        </thead>
        <tbody id="logBody"></tbody>
    </table>
</div>
<script>
var logData = [];
var expandedRow = null;

function reloadLogs() {
    window.chrome.webview.hostObjects.Logs.GetLogs().then(function(jsonStr) {
        try { logData = JSON.parse(jsonStr); } catch(e) { logData = []; }
        renderTable();
    });
}

function applyTheme() {
    window.chrome.webview.hostObjects.Logs.IsDarkMode().then(function(val) {
        var isDark = (val === 'true');
        document.body.className = isDark ? 'dark' : 'light';
    });
}

function renderTable() {
    var table = document.getElementById('logTable');
    var emptyState = document.getElementById('emptyState');
    var tbody = document.getElementById('logBody');
    var entryCount = document.getElementById('entryCount');

    if (logData.length === 0) {
        emptyState.style.display = 'flex';
        table.style.display = 'none';
        entryCount.textContent = '0 entries';
        return;
    }

    emptyState.style.display = 'none';
    table.style.display = '';
    entryCount.textContent = logData.length + ' entr' + (logData.length === 1 ? 'y' : 'ies');

    var html = '';
    for (var i = 0; i < logData.length; i++) {
        var entry = logData[i];
        var status = entry.status || 'unknown';
        var sClass = status === 'success' ? 'status-success' : 'status-error';
        var eid = 'det-' + i;

        html += '<tr class="clickable" onclick="td(' + i + ')">';
        html += '<td class="timestamp">' + esc(entry.timestamp||'') + '</td>';
        html += '<td>' + esc(entry.commandName||'') + '</td>';
        html += '<td class="model-name">' + esc(entry.model||entry.provider||'') + '</td>';
        html += '<td class="timestamp">' + fmtLatency(entry.latencyMs) + '</td>';
        html += '<td><span class="status-badge ' + sClass + '">' + esc(status) + '</span></td>';
        html += '<td class="endpoint-cell" title="' + esc(entry.endpoint||'') + '">' + esc(entry.endpoint||'') + '</td>';
        html += '</tr>';

        var reqBody = fj(entry.request);
        var method = 'POST';
        var ep = entry.endpoint || '';
        var reqHtml = '<div class="request-header">' + esc(method + ' ' + ep) + '</div><pre>' + esc(reqBody) + '</pre>';
        var resHtml = '<pre>' + esc(fj(entry.response)) + '</pre>';

        html += '<tr class="detail-row" id="' + eid + '">';
        html += '<td colspan="6" class="detail-cell"><div class="detail-inner">';
        html += '<div class="detail-tabs">';
        html += '<button class="detail-tab active" onclick="event.stopPropagation(); st(this,\'rq-' + i + '\')">Request</button>';
        html += '<button class="detail-tab" onclick="event.stopPropagation(); st(this,\'rs-' + i + '\')">Response</button>';
        html += '<button class="copy-btn" onclick="event.stopPropagation(); cp(' + i + ', this)">Copy</button>';
        html += '</div>';
        html += '<div class="detail-content active" id="rq-' + i + '">' + reqHtml + '</div>';
        html += '<div class="detail-content" id="rs-' + i + '">' + resHtml + '</div>';
        html += '</div></td></tr>';
    }
    tbody.innerHTML = html;

    if (expandedRow !== null && expandedRow < logData.length) {
        var row = document.getElementById('det-' + expandedRow);
        if (row) row.classList.add('expanded');
    }
}

function td(idx) {
    var row = document.getElementById('det-' + idx);
    if (!row) return;
    if (row.classList.contains('expanded')) {
        row.classList.remove('expanded');
        expandedRow = null;
    } else {
        if (expandedRow !== null) {
            var p = document.getElementById('det-' + expandedRow);
            if (p) p.classList.remove('expanded');
        }
        row.classList.add('expanded');
        expandedRow = idx;
    }
}

function st(tab, cid) {
    var p = tab.closest('.detail-inner');
    p.querySelectorAll('.detail-tab').forEach(function(t) { t.classList.remove('active'); });
    p.querySelectorAll('.detail-content').forEach(function(c) { c.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById(cid).classList.add('active');
}

function cp(idx, btn) {
    var e = logData[idx];
    if (!e) return;
        var txt = '=== API Request ===\n' + 'POST ' + (e.endpoint||'') + '\n' + fj(e.request)
                + '\n\n=== API Response ===\n' + fj(e.response)
                + '\n\n---\nTimestamp: ' + (e.timestamp||'')
                + ' | Model: ' + (e.model||'')
                + ' | Status: ' + (e.status||'')
                + ' | Latency: ' + fmtLatency(e.latencyMs);
    navigator.clipboard.writeText(txt).then(function() {
        var orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.background = 'var(--success-bg)';
        btn.style.color = 'var(--success-fg)';
        setTimeout(function() {
            btn.textContent = orig;
            btn.style.background = '';
            btn.style.color = '';
        }, 1500);
    });
}

function clearLogs() {
    if (logData.length === 0) return;
    window.chrome.webview.hostObjects.Logs.ClearLogs().then(function() {
        logData = [];
        expandedRow = null;
        renderTable();
    });
}

function fmtLatency(ms) {
    if (ms === undefined || ms === null || ms === '') return '-';
    if (ms < 1000) return Math.round(ms) + ' ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + ' s';
    var mins = Math.floor(ms / 60000);
    var secs = ((ms % 60000) / 1000).toFixed(0);
    return mins + ' min ' + secs + ' s';
}

function fj(data) {
    if (typeof data === 'string') {
        try { return JSON.stringify(JSON.parse(data), null, 2); } catch(e) { return data; }
    }
    if (data && typeof data === 'object') return JSON.stringify(data, null, 2);
    return String(data||'');
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&#38;';
        if (m === '<') return '&#60;';
        if (m === '>') return '&#62;';
        return '&#34;';
    });
}

window.addEventListener('load', function() {
    applyTheme();
    reloadLogs();
});
</script>
</body>
</html>
